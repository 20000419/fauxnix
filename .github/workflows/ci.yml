name: CI

on:
  push:
    branches: [main, quality/validation-20260930]
  pull_request:

concurrency:
  group: fauxnix-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64-desktop
            runner: windows-2025
            node_arch: x64
            fauxnix_ps: ''
            edition: Desktop
          - name: windows-x64-core
            runner: windows-2025
            node_arch: x64
            fauxnix_ps: pwsh
            edition: Core
          - name: windows-arm64-desktop
            runner: windows-11-arm
            node_arch: arm64
            fauxnix_ps: ''
            edition: Desktop
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      FAUXNIX_PS: ${{ matrix.fauxnix_ps }}
      FAUXNIX_HOST_READY_TIMEOUT_MS: '90000'
      FAUXNIX_DIFF_ORACLE: ${{ matrix.name == 'windows-x64-desktop' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          architecture: ${{ matrix.node_arch }}
      - name: Verify native Node architecture
        shell: pwsh
        run: |
          $actual = node -p process.arch
          if ($actual -ne '${{ matrix.node_arch }}') {
            throw "expected Node architecture ${{ matrix.node_arch }}, got $actual"
          }
      - run: npm ci
      - run: npm run release:check
      - name: Verify fauxnix selected the matrix host
        shell: pwsh
        run: |
          $check = npm run dev -- check 2>&1 | Out-String
          $check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($check -notmatch 'edition\s+:\s+${{ matrix.edition }}') {
            throw 'fauxnix check did not report the expected ${{ matrix.edition }} edition'
          }
      - name: Require the Git Bash differential oracle
        if: matrix.name == 'windows-x64-desktop'
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files\Git\bin\bash.exe')) {
            throw 'The validation lane requires a real Git Bash differential oracle'
          }
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npm run build
      - run: npm test
      - run: npm run test:package

  portable:
    name: portable (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npm run build
      # The native Windows execution and Git Bash oracle remain separate gates.
      - run: npm test -- --dir test
      - run: npm run test:package
